services:
  intrinsic-moveit-demo:
    build:
      context: .
      args:
        INTRINSIC_MOVEIT_COMMIT: c5e3290aa0f0e64c2d106a2fb4eb10cb52592205
        ROS_APT_SNAPSHOT: "2026-09-11"
    image: foxglove-tutorials/intrinsic-moveit-demo:latest
    ports:
      - "8765:8765"
    volumes:
      - ./recordings:/recordings
    environment:
      RECORD: "${RECORD:-true}"
      DEMO_CYCLES: "${DEMO_CYCLES:-0}"
    shm_size: 1gb
    init: false
    stop_signal: SIGINT
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD-SHELL", "grep -qiE '^ *[0-9]+: [0-9A-F]+:223D [0-9A-F]+:0000 0A' /proc/net/tcp /proc/net/tcp6 && test -f /tmp/intrinsic_demo_ready"]
      interval: 10s
      timeout: 3s
      start_period: 60s
      retries: 3
